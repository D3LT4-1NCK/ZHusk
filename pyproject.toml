[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zhusk"
version = "0.1.1"
authors = [{ name = "floppzh" }]
description = "ZHusk, a library to streamline workflows and assist those who work extensively with the terminal."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/D3LT4-1NCK/ZHusk"
